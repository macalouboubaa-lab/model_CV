<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <!-- Icône document -->
  <g transform="translate(10, 10)">
    <!-- Corps du document -->
    <path d="M 20 0 L 70 0 L 90 20 L 90 100 L 20 100 Z" fill="#2C3E50"/>
    <!-- Coin plié -->
    <path d="M 70 0 L 90 20 L 70 20 Z" fill="#FFC93C"/>
    <!-- Étoile -->
    <circle cx="75" cy="8" r="4" fill="#FFC93C"/>
    <!-- Lignes horizontales -->
    <rect x="30" y="35" width="50" height="4" fill="#95A5A6" rx="2"/>
    <rect x="30" y="50" width="50" height="4" fill="#95A5A6" rx="2"/>
    <rect x="30" y="65" width="35" height="4" fill="#95A5A6" rx="2"/>
    <rect x="30" y="80" width="45" height="4" fill="#95A5A6" rx="2"/>
    <!-- Barres de couleur en bas -->
    <rect x="30" y="90" width="12" height="3" fill="#27AE60" rx="1"/>
    <rect x="45" y="90" width="12" height="3" fill="#F1C40F" rx="1"/>
    <rect x="60" y="90" width="12" height="3" fill="#E74C3C" rx="1"/>
  </g>
  <!-- Texte SAMA CV. -->
  <text x="120" y="55" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#2C3E50" letter-spacing="2">SAMA</text>
  <text x="290" y="55" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#27AE60" letter-spacing="2">CV</text>
  <circle cx="375" cy="50" r="4" fill="#E74C3C"/>
  <!-- Sous-titre -->
  <text x="122" y="85" font-family="Arial, sans-serif" font-weight="400" font-size="11" fill="#7F8C8D" letter-spacing="2">VOTRE CURRICULUM VITAE EN LIGNE</text>
</svg>