<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0F19">
  <title>Suivi de paiement — SAMA CV</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <style>
    * { box-sizing:border-box; }
    body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0; padding:24px; background:#0B0F19; color:white; font-family:Arial,sans-serif; }
    main { width:min(100%,480px); margin:auto; }
    .card { padding:36px 28px; border:1px solid #41485b; border-radius:12px; background:#141824; text-align:center; }
    .check { display:grid; place-items:center; width:76px; height:76px; margin:0 auto 18px; border-radius:50%; background:#41485b; font-size:36px; }
    h1 { margin:0 0 12px; color:#fff; font-size:27px; }
    p { color:#B8BCC8; font-size:14px; line-height:1.6; }
    .btn { display:inline-block; margin:10px 5px 0; padding:13px 22px; border:0; border-radius:6px; background:#C342FF; color:white; font-weight:700; text-decoration:none; cursor:pointer; }
    .btn:hover { background:#A82EE0; }
    #status { min-height:24px; }
    .sama-footer { width:100%; margin:30px -24px -24px; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="success-title">
      <div class="check" aria-hidden="true">…</div>
      <h1 id="success-title">Suivi de votre paiement</h1>
      <p id="status" role="status" aria-live="polite">Vérification du statut…</p>
      <button id="refresh-status" class="btn" type="button">Actualiser le statut</button>
      <a class="btn" href="/index.html">Retour à la galerie</a>
    </section>
  </main>
  <footer class="sama-footer"><p>Créé par <strong>Boubacar Cissé</strong><span class="separator">•</span><a href="tel:+221754477448">#75 447 74 48</a></p></footer>
  <script src="/assets/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const status = document.querySelector('#status');
      const refreshButton = document.querySelector('#refresh-status');
      const requestedModel = new URLSearchParams(window.location.search).get('model') || 'model1';
      const modelId = /^model(?:[1-9]|1[0-4])$/.test(requestedModel) ? requestedModel : 'model1';
      const session = await window.getVerifiedSession();
      if (!session) {
        window.location.assign(`/login.html?next=${encodeURIComponent(`/payment-success.html?model=${modelId}`)}`);
        return;
      }
      const refreshStatus = async () => {
        refreshButton.disabled = true;
        status.textContent = 'Vérification du statut…';
        try {
          const paid = await window.getEntitlement(modelId);
          status.textContent = paid
            ? 'Votre paiement a été validé par l’administration. La remise du PDF privé n’est pas encore disponible.'
            : 'Votre demande est en attente de validation manuelle. Aucun téléchargement n’est débloqué pour le moment.';
        } catch (error) {
          status.textContent = error.message;
        }
        refreshButton.disabled = false;
      };
      refreshButton.addEventListener('click', refreshStatus);
      await refreshStatus();
    });
  </script>
</body>
</html>
